name: Project repository validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate project repository
        run: python tools/validate_project_repository.py
      - name: Validate Protocol contract
        run: python tools/validate_protocol_contract.py
