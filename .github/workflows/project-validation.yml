name: Project repository validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-validation.txt
      - name: Validate project repository
        run: python tools/validate_project_repository.py
      - name: Validate Protocol contract and Git provenance
        run: python tools/validate_protocol_contract.py --require-git-history
      - name: Run Protocol validator regression tests
        run: python tools/test_protocol_validator_regressions.py
